aid: federal-laboratory-consortium-for-technology-transfer
name: Federal Laboratory Consortium for Technology Transfer
description: The Federal Laboratory Consortium for Technology Transfer (FLC) is the nationwide network of more than
  300 federal laboratories, agencies and research centers chartered by the Federal Technology Transfer Act of 1986
  to move federally funded research into the wider economy. The FLC runs the FLC Business search over federal lab
  technologies and facilities, the interactive lab directory, the T2 Toolkit and Learning Center, and publishes
  the Green Book (Federal Technology Transfer Legislation and Policy). Its one machine-readable API surface is the
  public Greenbook API on api.federallabs.org, which backs the FLC Green Book mobile app with retrieval-augmented
  search over federal tech transfer legislation and policy.
